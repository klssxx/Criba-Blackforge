name: Portable Windows release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release tag
    runs-on: windows-2025
    timeout-minutes: 5
    outputs:
      release-tag: ${{ steps.tag.outputs.release-tag }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - id: tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+(\.[0-9]+){1,2}([-.][0-9A-Za-z.-]+)?$') {
            throw 'Release tag must use vMAJOR.MINOR or vMAJOR.MINOR.PATCH.'
          }
          "release-tag=$env:RELEASE_TAG" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

  package:
    name: Build tested portable artifact
    needs: validate-release
    if: needs.validate-release.result == 'success'
    runs-on: windows-2025
    timeout-minutes: 35
    outputs:
      archive-name: ${{ steps.package.outputs.archive-name }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      # v5.0.0, tag verified with git ls-remote on 2026-07-26.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate-release.outputs.release-tag }}
          fetch-depth: 1
          persist-credentials: false
      # v6.0.0, tag verified with git ls-remote on 2026-07-26.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      # v9.0.0, tag verified with git ls-remote on 2026-09-03.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.28'
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        shell: pwsh
        run: uv sync --all-extras --locked
      - name: Verify source before packaging
        shell: pwsh
        run: |
          uv run pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run mypy src/criba
          exit $LASTEXITCODE
      - name: Build portable application
        shell: pwsh
        run: .\scripts\build-portable.ps1
      - name: Package release evidence
        id: package
        shell: pwsh
        run: |
          $archive = 'CRIBA-Blackforge-Portable-Windows-x64.zip'
          $checksum = "$archive.sha256"
          Compress-Archive -Path 'dist\CRIBA-Blackforge\*' -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -LiteralPath $checksum -Encoding ascii -NoNewline
          "archive-name=$archive" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "sha256=$hash" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "sbom-name=CRIBA-Blackforge-Portable-Windows-x64.cdx.json" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
      - name: Generate CycloneDX SBOM
        shell: pwsh
        run: uv run cyclonedx-py environment --pyproject pyproject.toml --output-reproducible --output-format JSON --output-file CRIBA-Blackforge-Portable-Windows-x64.cdx.json
      # v4.6.2, tag verified with git ls-remote on 2026-07-26.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: portable-release
          path: |
            CRIBA-Blackforge-Portable-Windows-x64.zip
            CRIBA-Blackforge-Portable-Windows-x64.zip.sha256
            CRIBA-Blackforge-Portable-Windows-x64.cdx.json
          if-no-files-found: error
          retention-days: 14

  attest:
    name: Attest portable artifact
    needs: package
    if: needs.package.result == 'success'
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # v4.6.2, tag verified with git ls-remote on 2026-07-26.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: portable-release
      # v4, tag verified with git ls-remote on 2026-09-05.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: CRIBA-Blackforge-Portable-Windows-x64.zip
          # SBOM ships as a release asset; provenance attestation covers the zip.

  verify-attestation:
    name: Verify artifact attestation
    needs: [validate-release, package, attest]
    if: >
      !cancelled() &&
      needs.package.result == 'success' &&
      needs.attest.result == 'success'
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.validate-release.outputs.release-tag }}
      ARCHIVE_NAME: ${{ needs.package.outputs.archive-name }}
    steps:
      # v4.6.2, tag verified with git ls-remote on 2026-07-26.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: portable-release
      - name: Verify trusted provenance before publication
        shell: pwsh
        run: |
          & gh attestation verify $env:ARCHIVE_NAME `
            --repo $env:GITHUB_REPOSITORY `
            --signer-workflow '.github/workflows/release.yml' `
            --source-ref "refs/tags/$env:RELEASE_TAG" `
            --cert-oidc-issuer 'https://token.actions.githubusercontent.com' `
            --predicate-type 'https://slsa.dev/provenance/v1'
          exit $LASTEXITCODE

  publish:
    name: Publish attested release assets
    needs: [validate-release, package, attest, verify-attestation]
    if: >
      !cancelled() &&
      needs.validate-release.result == 'success' &&
      needs.package.result == 'success' &&
      needs.attest.result == 'success' &&
      needs.verify-attestation.result == 'success'
    runs-on: windows-2025
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.validate-release.outputs.release-tag }}
      ARCHIVE_NAME: ${{ needs.package.outputs.archive-name }}
      ARCHIVE_SHA256: ${{ needs.package.outputs.sha256 }}
    steps:
      # v4.6.2, tag verified with git ls-remote on 2026-07-26.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: portable-release
      - name: Upload the tested artifact and evidence
        shell: pwsh
        run: |
          $assets = @(
            $env:ARCHIVE_NAME,
            "$env:ARCHIVE_NAME.sha256",
            'CRIBA-Blackforge-Portable-Windows-x64.cdx.json'
          )
          & gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @(
            '## Portable release evidence',
            "- Tag: $env:RELEASE_TAG",
            "- Commit: $env:GITHUB_SHA",
            "- Artifact: $env:ARCHIVE_NAME",
            "- SHA-256: $env:ARCHIVE_SHA256",
            '- Attestation: verified before publication',
            "- Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
