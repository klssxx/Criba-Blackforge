name: Publish criba to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish attested sdist and wheel
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      # v6.0.0, tag verified with git ls-remote on 2026-07-26.
      - uses: actions/checkout@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
          fetch-depth: 1
          persist-credentials: false
      # v5.0.0, tag verified with git ls-remote on 2026-07-26.
      - uses: actions/setup-python@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          python-version: '3.11'
      - name: Build distributions
        shell: pwsh
        run: |
          python -m pip install --upgrade build
          python -m build
      # v2.x, verify tag before enabling.
      - name: Attest distributions
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: '${{ github.workspace }}/dist/*'
      # release/v1, verify tag before enabling. Requires a trusted publisher
      # mapping for this repository on pypi.org (see SECURITY.md).
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          verbose: true