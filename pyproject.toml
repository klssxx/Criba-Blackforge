[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "criba"
version = "0.2.0"
description = "Deterministic, auditable, local-first ideation engine with free-cloud LLM expansion (Z.ai GLM / Nous :free)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "CRIBA contributors"}]
keywords = [
  "ideation",
  "brainstorming",
  "innovation",
  "triz",
  "creativity",
  "causal-analysis",
  "cybersecurity",
  "deterministic",
  "reproducible",
  "offline-first",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Security",
]
dependencies = [
  "pydantic>=2",
  "PyYAML>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
mcp = ["mcp>=1.0"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=7.0",
  "pytest-timeout>=2.4",
  "mypy>=1.8",
  "types-PyYAML>=6.0",
  "httpx",
  "hypothesis>=6.0",
  "ruff>=0.16.5",
  "mutmut>=3.6",
  "pip-audit>=2.9",
  "bandit>=1.9",
  "pre-commit>=4.6",
  "semgrep>=1.176",
  "cyclonedx-bom>=7.0",
]
build = ["pyinstaller>=6.0"]

[project.urls]
Homepage = "https://github.com/klssxx/Criba-Blackforge"
Repository = "https://github.com/klssxx/Criba-Blackforge.git"
Issues = "https://github.com/klssxx/Criba-Blackforge/issues"

[project.scripts]
criba = "criba.cli:main"

[tool.setuptools]
package-dir = {"" = "src", "data" = "data"}

[tool.setuptools.packages.find]
where = ["src", "."]
namespaces = true
include = ["criba*", "data"]

[tool.pytest.ini_options]
# "." makes the repo root importable so tests can import scripts.* both under
# `python -m pytest` (CWD on sys.path) and plain `pytest`/`uv run pytest` (CI).
pythonpath = ["src", "."]

[tool.mypy]
# FASE 3 hardening: strict typing over CRIBA + BLACKFORGE own code.
python_version = "3.12"
strict = true
# Qt view modules are runtime-verified by the real GUI and UI-contract tests.
# PySide's dynamic signal/event APIs do not form a useful strict-mypy boundary;
# keep strict checking on the engine and integration code instead.
exclude = "(gui\\.py$|[\\\\/]ui[\\\\/])"

[[tool.mypy.overrides]]
# gui.py is excluded as an explicit target above, but cli.py imports it lazily.
# Do not follow that single view module during core checking.
module = "criba.gui"
follow_imports = "skip"

[[tool.mypy.overrides]]
# Keep excluded Qt view modules out when a strictly typed core module imports
# their public boundary lazily.
module = ["criba.ui", "criba.ui.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
# uvicorn is an OPTIONAL runtime dependency (imported inside a try/except with a
# stdlib fallback in api.py). It ships no type stubs; ignore the missing import
# at that boundary only, without weakening strictness elsewhere.
module = ["uvicorn", "uvicorn.*"]
ignore_missing_imports = true

[tool.mutmut]
source_paths = ["src"]
only_mutate = ["src/criba/personas.py"]
also_copy = ["data"]
pytest_add_cli_args_test_selection = [
  "tests/unit/test_personas.py",
  "tests/property/test_personas_properties.py",
  "tests/adversarial/test_personas_adversarial.py",
]
pytest_add_cli_args = [
  "-p",
  "no:cacheprovider",
  "--timeout=60",
  "--timeout-method=thread",
]
use_git_change_detection = false
max_stack_depth = 16