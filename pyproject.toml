[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "criba-current-engine"
version = "0.1.0"
description = "Local, deterministic CRIBA pre-response engine"
requires-python = ">=3.10"
authors = [{name = "CRIBA Current Engine"}]
dependencies = [
  "pydantic>=2",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
mcp = ["mcp>=1.0"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=7.0",
  "pytest-timeout>=2.4",
  "mypy>=1.8",
  "httpx",
  "hypothesis>=6.0",
  "ruff>=0.12",
  "mutmut>=3.5",
  "pip-audit>=2.9",
  "cyclonedx-bom>=7.0",
]
build = ["pyinstaller>=6.0"]

[project.scripts]
criba = "criba.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
# FASE 3 hardening: strict typing over CRIBA + BLACKFORGE own code.
python_version = "3.12"
strict = true
# gui.py is runtime-verified (offscreen smoke + UI contract), not strictly typed:
# it is untyped PySide6 view code. Exclude it so mypy strict checks the engine
# core; the GUI is validated by execution, not by the type checker.
exclude = "gui\\.py$"

[[tool.mypy.overrides]]
# gui.py is excluded as an explicit target above, but cli.py imports it lazily.
# Do not follow that single view module during core checking.
module = "criba.gui"
follow_imports = "skip"

[[tool.mypy.overrides]]
# uvicorn is an OPTIONAL runtime dependency (imported inside a try/except with a
# stdlib fallback in api.py). It ships no type stubs; ignore the missing import
# at that boundary only, without weakening strictness elsewhere.
module = ["uvicorn", "uvicorn.*"]
ignore_missing_imports = true

[tool.mutmut]
source_paths = ["src/criba/personas.py"]
pytest_add_cli_args_test_selection = [
  "tests/unit/test_personas.py",
  "tests/property/test_personas_properties.py",
  "tests/adversarial/test_personas_adversarial.py",
]
pytest_add_cli_args = [
  "-p",
  "no:cacheprovider",
  "--timeout=60",
  "--timeout-method=thread",
]
use_git_change_detection = false
max_stack_depth = 16
